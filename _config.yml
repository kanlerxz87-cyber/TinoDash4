# GitHub Pages is built from the repository root using Jekyll.
# The root dashboard contains rounded, derived household outputs and is not certified anonymous.
# Alternate model/site trees are excluded from the Pages artifact, but remain visible in public Git.
# This configuration limits Pages output; it is not access control or a history purge.
exclude:
  - .github
  - COORDINATION.md
  - DECISION_RULES.md
  - README.md
  - decision-model
  - decision-workspace
  - model
  - research
  - site
  - tools
  - private
  - '*.py'
  - '*.md'
