name: Verify model + site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate model data (deterministic)
        run: python3 model/build_model.py
      - name: Fail if regeneration changed tracked data (data must be committed in sync)
        run: git diff --exit-code -- site/data
      - name: Headless smoke test of all site renderers
        run: node model/check_site.js
      - name: Build the public root dashboard
        run: python3 tools/build_site.py
      - name: Check root Pages artifact privacy, sources, rounding, and links
        run: python3 tools/check_site.py
      - name: Ensure Jekyll exclusions stay enabled
        run: test ! -e .nojekyll
