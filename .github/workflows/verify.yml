name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish gate (identifiers, rounding, row links, internal links, required content)
        run: python3 tools/check_site.py --allow-missing-private
