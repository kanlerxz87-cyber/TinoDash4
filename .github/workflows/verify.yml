name: Verify model + site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # site/ and decision-workspace/ were untracked (archived locally, gitignored) on 2026-11-26.
      # Their regeneration and smoke-test steps were removed.
      - name: Rebuild root dashboard (deterministic from data/model_outputs.json)
        run: python3 tools/build_site.py
      - name: Fail if rebuild changed tracked root site (must be committed in sync)
        run: git diff --exit-code -- '*.html' assets data/irregularities.json
      - name: Pre-publish gate (privacy, rounding, row links, internal links, Pages containment)
        run: python3 tools/check_site.py --allow-missing-private
      - name: Ensure Jekyll exclusions stay enabled
        run: test ! -e .nojekyll
