name: Verify model + site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild root dashboard (deterministic from data/model_outputs.json)
        run: python3 tools/build_site.py
      - name: Fail if rebuild changed tracked root site (must be committed in sync)
        run: git diff --exit-code -- '*.html' assets data/irregularities.json
      - name: Public-surface hygiene gate (exact private-input check is intentionally skipped)
        run: python3 tools/check_site.py --public-only
      - name: Regenerate site/ model data (deterministic)
        run: python3 model/build_model.py
      - name: Fail if regeneration changed tracked data (data must be committed in sync)
        run: git diff --exit-code -- site/data
      - name: Headless smoke test of all site renderers
        run: node model/check_site.js
      - name: Ensure Jekyll exclusions stay enabled
        run: test ! -e .nojekyll
